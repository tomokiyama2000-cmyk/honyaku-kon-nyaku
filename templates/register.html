<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ほんやくコンニャク - 新規登録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-screen">
  <div class="gadget-badge">
    <span class="gadget-badge__knob"></span>
    <h1 class="app__title app__title--small">ほんやくコンニャク</h1>
  </div>
  <p class="app__tagline">新しいアカウントを作成します</p>

  <form method="POST" class="login-form">
    <input type="text" name="username" placeholder="ユーザー名" autofocus>
    <input type="password" name="password" placeholder="パスワード（6文字以上）">
    <input type="password" name="password_confirm" placeholder="パスワード（確認用）">
    <button type="submit">登録する</button>
  </form>

  {% if error %}
    <p class="login-error">{{ error }}</p>
  {% endif %}

  <p class="auth-switch-link"><a href="{{ url_for('login') }}">すでにアカウントをお持ちの方はこちら</a></p>
</div>

</body>
</html>
